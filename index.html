<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <h1>Jogo de Adivinhação</h1>
    <p>Escolha um número entre 1 e 100</p>
    <input type="number" id="palpite" min="1" max="100">
    <br>
    <button onclick="jogar()">Tentar</button>
    <button onclick="reiniciarJogo()">Reiniciar</button>
    <div class="mensagem" id="mensagem"></div>
    <div class="tentativas" id="tentativasRestantes"></div>
    <div class="recorde" id="recorde"></div>
  </div>

  <script>
    let numeroSecreto = Math.floor(Math.random() * 100) + 1;
    let tentativas = 0;
    let limiteTentativas = 10;
    let recorde = localStorage.getItem('recorde') || null;

    function jogar() {
      const palpite = parseInt(document.getElementById('palpite').value);
      const mensagem = document.getElementById('mensagem');
      const tentativasRestantes = document.getElementById('tentativasRestantes');

      if (palpite < 1 || palpite > 100 || isNaN(palpite)) {
        mensagem.textContent = "Digite um número válido entre 1 e 100.";
        return;
      }

      tentativas++;

      if (palpite === numeroSecreto) {
        mensagem.textContent = `Parabéns! Você acertou em ${tentativas} tentativa(s).`;

        if (!recorde || tentativas < recorde) {
          recorde = tentativas;
          localStorage.setItem('recorde', recorde);
          document.getElementById('recorde').textContent = `Novo recorde: ${recorde} tentativa(s)!`;
        }

        tentativasRestantes.textContent = "";
        return;
      }

      if (tentativas >= limiteTentativas) {
        mensagem.textContent = `Você perdeu! O número era ${numeroSecreto}.`;
        tentativasRestantes.textContent = "Suas tentativas acabaram.";
        return;
      }

      if (palpite > numeroSecreto) {
        mensagem.textContent = "Muito alto! Tente um número menor.";
      } else {
        mensagem.textContent = "Muito baixo! Tente um número maior.";
      }

      tentativasRestantes.textContent = `Tentativas restantes: ${limiteTentativas - tentativas}`;
      atualizarRecorde();
    }

    function reiniciarJogo() {
      numeroSecreto = Math.floor(Math.random() * 100) + 1;
      tentativas = 0;
      document.getElementById('mensagem').textContent = "";
      document.getElementById('palpite').value = "";
      document.getElementById('tentativasRestantes').textContent = `Tentativas restantes: ${limiteTentativas}`;
    }

    function atualizarRecorde() {
      if (recorde) {
        document.getElementById('recorde').textContent = `Recorde atual: ${recorde} tentativa(s).`;
      }
    }

    document.getElementById('tentativasRestantes').textContent = `Tentativas restantes: ${limiteTentativas}`;
    atualizarRecorde();

    // Permitir que Enter acione o botão "Tentar"
    document.getElementById('palpite').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        jogar();
      }
    });
  </script>
</body>
</html>
